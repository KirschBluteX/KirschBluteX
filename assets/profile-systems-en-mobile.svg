<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830"
  role="img" aria-labelledby="title desc">
  <title id="title">AI coding-agent systems map</title>
  <desc id="desc">Failure conditions pass through three complementary system boundaries into trusted state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2328; text-anchor: middle; }
    .title { font-size: 27px; font-weight: 700; }
    .body { font-size: 22px; }
    .group { font-size: 20px; font-weight: 700; fill: #57606a; }
    .arrow { fill: none; stroke: #57606a; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <rect width="640" height="830" fill="#ffffff"/>
  <rect x="80" y="20" width="480" height="112" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="2.5"/>
  <text class="title" x="320" y="58">Failure conditions</text>
  <text class="body" x="320" y="91">concurrency · restart · side effects</text>
  <text class="body" x="320" y="117">protocol change</text>
  <path class="arrow" d="M 320 132 L 320 172"/>
  <rect x="50" y="172" width="540" height="440" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2.5"/>
  <text class="group" x="320" y="205">THREE COMPLEMENTARY SYSTEM BOUNDARIES</text>
  <rect x="85" y="230" width="470" height="92" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <text class="title" x="320" y="267">Pi Coding Harness</text>
  <text class="body" x="320" y="299">execution authority · recovery</text>
  <rect x="85" y="355" width="470" height="92" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
  <text class="title" x="320" y="392">Agent Orchestration Gateway</text>
  <text class="body" x="320" y="424">delegation · integration</text>
  <rect x="85" y="480" width="470" height="92" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="2.5"/>
  <text class="title" x="320" y="517">Engineer Software</text>
  <text class="body" x="320" y="549">decisions · evaluation</text>
  <path class="arrow" d="M 320 612 L 320 660"/>
  <rect x="80" y="660" width="480" height="112" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text class="title" x="320" y="703">Trusted system state</text>
  <text class="body" x="320" y="741">bounded authority · fresh evidence</text>
</svg>
